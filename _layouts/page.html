---
layout: default
---
<header class="page-header prose-page" style="padding-bottom:0">
  <p class="eyebrow">{{ page.eyebrow | default: site.title }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p>{{ page.description }}</p>{% endif %}
</header>

<div class="prose-page">
  <div class="post-content">
    {{ content }}
  </div>
</div>
