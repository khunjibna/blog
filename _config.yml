url: "https://khunjibna.github.io"
baseurl: "/blog"
lang: th
timezone: Asia/Bangkok
permalink: /:categories/:year/:month/:day/:title/

author:
  name: Khunjibna
  bio: Essays, travel notes, and quiet observations collected with intention.
  email: hello@example.com

tagline: Curated Narrative Since 2018
